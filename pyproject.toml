[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurguard"
version = "0.1.0"
description = "Review what changed in the AUR packages you have installed before you upgrade them"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# optional: plain-language explanation of flagged diffs by an AI model (aurguard setup)
claude = ["anthropic>=2", "pydantic>=2"]
openai = ["openai>=2", "pydantic>=2"]  # ChatGPT, Gemini, DeepSeek and other OpenAI-compatible APIs
ai = ["anthropic>=2", "openai>=2", "pydantic>=2"]

[project.scripts]
aurguard = "aurguard.cli:main"

[tool.setuptools]
packages = ["aurguard"]
